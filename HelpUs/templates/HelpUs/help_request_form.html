{% extends 'HelpUs/base.html' %}

{% block main %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h3>Proposer une demande d'aide</h3>
                </div>

                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary btn-block">
                            Publier ma demande
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
